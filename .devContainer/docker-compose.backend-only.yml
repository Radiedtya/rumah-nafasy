services:
  backend:
    build:
      context: ..
      dockerfile: .devContainer/Dockerfile.backend
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY before starting the backend}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/backend/storage/app/database.sqlite
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
    volumes:
      - backend_storage:/var/www/html/backend/storage
    restart: unless-stopped

volumes:
  backend_storage:
